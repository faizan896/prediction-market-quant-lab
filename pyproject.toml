[project]
name = "quantlab"
version = "0.1.0"
description = "Prediction Market Quant Lab — research, backtest, paper trade, live trade."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "typer>=0.12",
    "python-dateutil>=2.9",
    # fastapi is a core dependency, not an extra. Serverless builders (Vercel
    # among them) install from [project.dependencies] and ignore extras, so
    # leaving it under `api` produced a deployment that imported cleanly
    # everywhere except in production: ModuleNotFoundError: No module named
    # 'fastapi'. `uvicorn` stays optional — you only need it to self-host.
    "fastapi>=0.110",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]
api = ["uvicorn[standard]>=0.29"]
cache = ["redis>=5.0"]
quant = ["scikit-learn>=1.4", "scipy>=1.12", "statsmodels>=0.14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
quantlab = "quantlab.cli:app"
quantlab-api = "quantlab.api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend"]

[tool.ruff.lint.isort]
# Pin first-party detection. Without this, ruff infers it from the directory
# layout, which differs between a source checkout and a fresh clone — so
# `ruff check .` passes locally and fails in CI with I001 on identical bytes.
known-first-party = ["quantlab"]

[tool.ruff.lint.per-file-ignores]
# `x: T = Depends(...)` in a signature default IS the FastAPI idiom; B008 is
# a false positive for the whole framework.
"quantlab/api/main.py" = ["B008"]
